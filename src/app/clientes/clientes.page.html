<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Lista de Clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding bg-mena">
  
  <!-- Barra de Búsqueda por Nombre -->
  <ion-searchbar 
    placeholder="Buscar cliente por nombre o cédula..." 
    (ionInput)="filtrarClientes($event)"
    animated="true">
  </ion-searchbar>

  <!-- Lista de Clientes Filtrados -->
  <ion-list *ngIf="clientesFiltrados.length > 0; else noData" class="client-list">
    <ion-item *ngFor="let cliente of clientesFiltrados" (click)="verDetalleContrato(cliente)" button detail="true" class="client-item">
      <ion-label>
        <h2><strong>{{ cliente.clientName }}</strong></h2>
        <p>Cédula: {{ cliente.clientCedula }} | Tel: {{ cliente.clientPhone }}</p>
        <p class="loan-info"><strong>Préstamo:</strong> RD$ {{ cliente.loanAmount | number }} ({{ cliente.loanType }})</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Mensaje si no hay resultados -->
  <ng-template #noData>
    <div class="empty-state">
      <p>No se encontraron clientes con ese nombre.</p>
    </div>
  </ng-template>

  <!-- Botón de Retorno -->
  <div style="margin-top: 30px;">
    <ion-button expand="block" fill="outline" color="medium" (click)="goBack()">
      Volver al Inicio
    </ion-button>
  </div>

</ion-content>
