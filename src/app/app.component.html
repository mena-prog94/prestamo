<ion-app>
  <!-- Menú lateral -->
  <ion-menu content-id="main-content">
    <ion-header>
      <ion-toolbar class="primary">
        <ion-title>Préstamos Mena</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item class="cliente" routerLink="/principal" routerDirection="root" lines="none" button (click)="cerrarMenu()">
          <ion-label>📝 Nuevo Préstamo</ion-label>
        </ion-item>
        
        <ion-item class="cliente" routerLink="/clientes" routerDirection="root" lines="none" button (click)="cerrarMenu()">
          <ion-label>👥 Lista de Clientes</ion-label>
        </ion-item>

        <!-- Botón de Cerrar Sesión -->
        <ion-item class="cliente" lines="none" button (click)="confirmarCerrarSesion()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          <ion-label>🚪 Cerrar Sesión</ion-label>
        </ion-item>

      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Contenedor principal -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
