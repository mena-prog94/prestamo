<ion-content class="ion-padding bg-mena">
  <div class="login-container">
    <!-- Branding Visual -->
    <div class="brand-header">
      <div class="logo-circle">
        <ion-icon name="wallet-outline"></ion-icon>
      </div>
      <h1>PRÉSTAMOS MENA</h1>
      <p class="subtitle">Soluciones financieras a tu medida</p>
    </div>

    <!-- Formulario Dinámico -->
    <div class="login-card">
      <ion-item lines="none" class="custom-input">
        <ion-icon slot="start" name="mail-outline" color="primary"></ion-icon>
        <ion-input placeholder="Correo electrónico" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-icon slot="start" name="lock-closed-outline" color="primary"></ion-icon>
        <ion-input type="password" placeholder="Contraseña" [(ngModel)]="password"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="onLogin()" class="btn-login">
        Ingresar al Sistema
      </ion-button>
    </div>

    <!-- Contacto Rápido -->
    <div class="footer-contact" (click)="goToRegister()">
      <p>¿No tienes cuenta? <span class="highlight">Regístrate aquí</span></p>
      
    </div>
  </div>
</ion-content>
